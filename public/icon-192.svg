<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="192" height="192" rx="42" fill="url(#grad1)" />
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Modern Building & Key Motif -->
  <g transform="translate(36, 32)">
    <!-- Main House Outline -->
    <path d="M60 12 L10 52 L22 52 L22 108 L98 108 L98 52 L110 52 Z" fill="#0f172a" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round" />
    <!-- Roof accent -->
    <path d="M60 4 L0 52 L16 52 L60 16 L104 52 L120 52 Z" fill="url(#gold)" filter="url(#glow)" opacity="0.8" />
    <!-- Chimney / Tower -->
    <rect x="80" y="20" width="12" height="24" rx="2" fill="#38bdf8" opacity="0.6" />
    <!-- Windows -->
    <rect x="36" y="58" width="18" height="18" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="66" y="58" width="18" height="18" rx="3" fill="#38bdf8" opacity="0.9" />
    <!-- Door / Vault -->
    <rect x="48" y="86" width="24" height="22" rx="4" fill="url(#gold)" />
    <!-- Keyhole -->
    <circle cx="60" cy="94" r="2.5" fill="#0f172a" />
    <polygon points="58.5,95 61.5,95 62,102 58,102" fill="#0f172a" />
  </g>
</svg>
