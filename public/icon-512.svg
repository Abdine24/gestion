<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#gradBg)" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />
  
  <g transform="translate(96, 85)">
    <!-- Main House Structure -->
    <path d="M160 32 L26 138 L58 138 L58 288 L262 288 L262 138 L294 138 Z" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="10" stroke-linejoin="round" />
    <!-- Overhang Roof -->
    <path d="M160 10 L0 138 L42 138 L160 42 L278 138 L320 138 Z" fill="url(#accentGrad)" filter="url(#glow512)" opacity="0.9" />
    <!-- Windows -->
    <rect x="95" y="160" width="48" height="48" rx="8" fill="#38bdf8" opacity="0.9" />
    <rect x="177" y="160" width="48" height="48" rx="8" fill="#38bdf8" opacity="0.9" />
    <!-- Window panes divider -->
    <line x1="119" y1="160" x2="119" y2="208" stroke="#0f172a" stroke-width="3" />
    <line x1="95" y1="184" x2="143" y2="184" stroke="#0f172a" stroke-width="3" />
    <line x1="201" y1="160" x2="201" y2="208" stroke="#0f172a" stroke-width="3" />
    <line x1="177" y1="184" x2="225" y2="184" stroke="#0f172a" stroke-width="3" />
    <!-- Main Entrance Door -->
    <rect x="128" y="232" width="64" height="56" rx="10" fill="url(#accentGrad)" />
    <circle cx="160" cy="252" r="6" fill="#0f172a" />
    <polygon points="156,254 164,254 165,272 155,272" fill="#0f172a" />
  </g>
</svg>
